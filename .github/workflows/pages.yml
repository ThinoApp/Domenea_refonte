name: Deploy DOMENEA preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        shell: bash
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '_site' \
            --exclude 'pano2vr-output.zip' \
            ./ _site/

          if [ -f pano2vr-output.zip ]; then
            mkdir -p _site/pano2vr
            unzip -q pano2vr-output.zip -d _site/pano2vr
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
